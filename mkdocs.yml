site_name: Terralings
site_description: An interactive, client-side WebAssembly learning platform and comprehensive reference manual for Terraform and OpenTofu.
site_url: https://dnf0.github.io/terralings/
site_author: Daniel Fisher
repo_name: dnf0/terralings
repo_url: https://github.com/dnf0/terralings

theme:
  name: material
  palette:
    # Palette toggle for dark mode
    - scheme: slate
      primary: cyan
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    # Palette toggle for light mode
    - scheme: default
      primary: cyan
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list

nav:
  - Overview: index.md
  - Interactive Playground: playground/index.html
  - Syllabus & Curriculum: syllabus.md
  - Core HCL & Data Flow:
      - 01. HCL Foundations & Primitives: guides/01-primitives.md
      - 02. Input Variables & Validations: guides/02-variables.md
      - 03. Outputs, Locals & Expressions: guides/03-outputs-locals.md
      - 04. Functions & Collections: guides/04-functions.md
  - Dynamic Logic & Modules:
      - 05. Meta-Arguments & Scaling: guides/05-meta-arguments.md
      - 06. Dynamic Blocks & Logic: guides/06-dynamic-blocks.md
      - 07. Data Sources & Queries: guides/07-data-sources.md
      - 08. Modular Architecture: guides/08-modules.md
  - State Surgery, Testing & Governance:
      - 09. State Management & Refactoring: guides/09-state-management.md
      - 10. Native Testing (.tftest.hcl): guides/10-testing.md
      - 11. Production Patterns: guides/11-production-patterns.md
      - 12. OpenTofu Innovations: guides/12-opentofu.md
      - 13. Architecture Governance: guides/13-governance.md
  - Contributing: contributing.md

not_in_nav: |
  superpowers/**
  plans/**
  playground/**
  getting-started.md
  onboarding-guide.md
  cli-reference.md
  vscode-extension.md

