<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E2E" />
      <stop offset="100%" stop-color="#11111B" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C4EE5" />
      <stop offset="100%" stop-color="#844FBA" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D7D7" />
      <stop offset="100%" stop-color="#50FA7B" />
    </linearGradient>
    <linearGradient id="tofuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#313244" stroke-width="2" />

  <!-- Isometric Hex Cube / IaC Block -->
  <!-- Top Face -->
  <polygon points="64,22 98,41 64,60 30,41" fill="url(#primaryGrad)" opacity="0.95" />
  
  <!-- Left Face -->
  <polygon points="30,41 64,60 64,102 30,83" fill="#4338CA" opacity="0.9" />
  
  <!-- Right Face -->
  <polygon points="64,60 98,41 98,83 64,102" fill="url(#primaryGrad)" opacity="0.75" />

  <!-- Center sprout / code chevron badge -->
  <g filter="url(#glow)">
    <!-- Terminal Prompt / Chevron > -->
    <path d="M52,56 L62,65 L52,74" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Cursor / Progress pulse bar -->
    <line x1="68" y1="74" x2="78" y2="74" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Sprout Leaf Accent (Learning Symbol) on top right -->
  <path d="M78,28 C86,22 96,26 96,26 C96,26 98,36 90,42 C84,46 76,38 78,28 Z" fill="url(#accentGrad)" opacity="0.9" />
  <path d="M78,28 Q86,34 96,26" fill="none" stroke="#00D7D7" stroke-width="1.5" stroke-linecap="round" />

  <!-- OpenTofu Amber Accent pip -->
  <circle cx="64" cy="41" r="3.5" fill="url(#tofuGrad)" />
</svg>
