name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run Quality Checks and Full Build
        run: make check build-all

  test:
    name: Test (${{ matrix.os }} - ${{ matrix.engine }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        engine: [opentofu, terraform]
        include:
          - engine: opentofu
            tofu-version: '1.6.2'
          - engine: terraform
            tf-version: '1.6.6'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Set up OpenTofu
        if: matrix.engine == 'opentofu'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ matrix.tofu-version }}
          tofu_wrapper: false

      - name: Set up Terraform
        if: matrix.engine == 'terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.tf-version }}
          terraform_wrapper: false

      - name: Verify OpenTofu Version
        if: matrix.engine == 'opentofu'
        run: tofu version | head -1 | tee /dev/stderr | grep -qxF "OpenTofu v${{ matrix.tofu-version }}"

      - name: Verify Terraform Version
        if: matrix.engine == 'terraform'
        run: terraform version | head -1 | tee /dev/stderr | grep -qxF "Terraform v${{ matrix.tf-version }}"

      - name: Build Binary via Makefile
        run: make build

      - name: Check Solution HCL Formatting (OpenTofu)
        if: matrix.engine == 'opentofu'
        run: tofu fmt -check -recursive solutions/

      - name: Check Solution HCL Formatting (Terraform)
        if: matrix.engine == 'terraform'
        run: terraform fmt -check -recursive solutions/

      - name: Run Tests via Makefile
        run: make test-race
