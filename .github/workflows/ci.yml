name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Check Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run Vet (Lint)
        run: make lint

  test:
    name: Test (${{ matrix.os }} - ${{ matrix.engine }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        engine: [opentofu, terraform]
        include:
          - engine: opentofu
            tofu-version: '1.6.2'
          - engine: terraform
            tf-version: '1.6.6'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Set up OpenTofu
        if: matrix.engine == 'opentofu'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ matrix.tofu-version }}

      - name: Set up Terraform
        if: matrix.engine == 'terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.tf-version }}
          terraform_wrapper: false

      - name: Verify OpenTofu Version
        if: matrix.engine == 'opentofu'
        run: tofu version | grep -F "v${{ matrix.tofu-version }}"

      - name: Verify Terraform Version
        if: matrix.engine == 'terraform'
        run: terraform version | grep -F "v${{ matrix.tf-version }}"

      - name: Build Binary via Makefile
        run: make build

      - name: Run Tests via Makefile
        run: make test
