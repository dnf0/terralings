name: Terralings Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-release:
    name: Build Binary (${{ matrix.target.os }}-${{ matrix.target.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: linux
            arch: amd64
            archive: tar.gz
          - os: linux
            arch: arm64
            archive: tar.gz
          - os: darwin
            arch: amd64
            archive: tar.gz
          - os: darwin
            arch: arm64
            archive: tar.gz
          - os: windows
            arch: amd64
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build Binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
        run: |
          BINARY_NAME="terralings"
          if [ "${{ matrix.target.os }}" = "windows" ]; then
            BINARY_NAME="terralings.exe"
          fi
          go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name || inputs.tag_name }}" -o "dist/${BINARY_NAME}" ./cmd/terralings

      - name: Package Archive
        run: |
          TAG="${{ github.ref_name || inputs.tag_name }}"
          PKG_NAME="terralings-${TAG}-${{ matrix.target.os }}-${{ matrix.target.arch }}"
          mkdir -p "pkg/${PKG_NAME}"
          cp dist/* "pkg/${PKG_NAME}/"
          cp LICENSE README.md "pkg/${PKG_NAME}/"
          
          if [ "${{ matrix.target.archive }}" = "zip" ]; then
            cd pkg && zip -r "../${PKG_NAME}.zip" "${PKG_NAME}" && cd ..
            echo "ASSET_FILE=${PKG_NAME}.zip" >> $GITHUB_ENV
          else
            cd pkg && tar -czf "../${PKG_NAME}.tar.gz" "${PKG_NAME}" && cd ..
            echo "ASSET_FILE=${PKG_NAME}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_FILE }}
          path: ${{ env.ASSET_FILE }}

  publish-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          tag_name: ${{ github.ref_name || inputs.tag_name }}
