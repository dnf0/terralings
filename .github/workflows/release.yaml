name: Terralings Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v0.3.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  check-version:
    name: Check Release Version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version and tags
        id: check
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "Triggered by tag: ${{ github.ref_name }}"
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ inputs.tag_name }}" ]; then
            echo "Triggered manually with tag: ${{ inputs.tag_name }}"
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag_name=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep 'Number =' internal/version/version.go | cut -d '"' -f 2)
            TAG="v$VERSION"
            echo "Current version is $VERSION (tag: $TAG)"
            
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists on repository. Skipping release."
              echo "should_release=false" >> $GITHUB_OUTPUT
            else
              echo "New version detected ($TAG). Tagging and creating release!"
              echo "should_release=true" >> $GITHUB_OUTPUT
              echo "tag_name=$TAG" >> $GITHUB_OUTPUT
              
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag -a "$TAG" -m "Release $TAG"
              git push origin "$TAG"
            fi
          fi

  build-release:
    name: Build Binary (${{ matrix.target.os }}-${{ matrix.target.arch }})
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: linux
            arch: amd64
            archive: tar.gz
          - os: linux
            arch: arm64
            archive: tar.gz
          - os: darwin
            arch: amd64
            archive: tar.gz
          - os: darwin
            arch: arm64
            archive: tar.gz
          - os: windows
            arch: amd64
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build Binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
        run: |
          BINARY_NAME="terralings"
          if [ "${{ matrix.target.os }}" = "windows" ]; then
            BINARY_NAME="terralings.exe"
          fi
          TAG="${{ needs.check-version.outputs.tag_name }}"
          go build -trimpath -ldflags="-s -w -X main.version=${TAG}" -o "dist/${BINARY_NAME}" ./cmd/terralings

      - name: Package Archive
        run: |
          TAG="${{ needs.check-version.outputs.tag_name }}"
          PKG_NAME="terralings-${TAG}-${{ matrix.target.os }}-${{ matrix.target.arch }}"
          mkdir -p "pkg/${PKG_NAME}"
          cp dist/* "pkg/${PKG_NAME}/"
          cp LICENSE README.md "pkg/${PKG_NAME}/"
          
          if [ "${{ matrix.target.archive }}" = "zip" ]; then
            cd pkg && zip -r "../${PKG_NAME}.zip" "${PKG_NAME}" && cd ..
            echo "ASSET_FILE=${PKG_NAME}.zip" >> $GITHUB_ENV
          else
            cd pkg && tar -czf "../${PKG_NAME}.tar.gz" "${PKG_NAME}" && cd ..
            echo "ASSET_FILE=${PKG_NAME}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_FILE }}
          path: ${{ env.ASSET_FILE }}

  build-vscode-extension:
    name: Package VS Code Extension (.vsix)
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "extensions/vscode/package-lock.json"

      - name: Install Dependencies
        run: make extension-install

      - name: Build and Package Extension
        run: make extension-package

      - name: Upload VS Code Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terralings-vscode.vsix
          path: dist/terralings-vscode.vsix

  publish-release:
    name: Create GitHub Release
    needs: [check-version, build-release, build-vscode-extension]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          tag_name: ${{ needs.check-version.outputs.tag_name }}

  publish-vscode-marketplace:
    name: Publish to VS Code Marketplace
    needs: [check-version, publish-release]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "extensions/vscode/package-lock.json"

      - name: Install Dependencies
        run: make extension-install

      - name: Publish to Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          make extension-package
          npx @vscode/vsce publish --packagePath dist/terralings-vscode.vsix --skip-duplicate --pat "$VSCE_PAT"

